# Alembic configuration for Kinetic Ledger.
#
# Migration scripts live in `alembic/`; the SQLAlchemy model metadata is
# pulled from `kinetic_ledger.database.database:Base`.
#
# Usage:
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = src

# Database URL is read from the DATABASE_URL environment variable in
# alembic/env.py. Override here only if you want a hardcoded value.
# sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S