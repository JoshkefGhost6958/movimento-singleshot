services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-ledger-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Inside the compose network the app reaches Postgres/Redis by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinetic}:${POSTGRES_PASSWORD:-kinetic_password}@db:5432/${POSTGRES_DB:-kinetic_ledger}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status/health"]
      interval: 1000s
      timeout: 1000s
      start_period: 15s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    container_name: kinetic-ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinetic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetic_password}
      POSTGRES_DB: ${POSTGRES_DB:-kinetic_ledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinetic} -d ${POSTGRES_DB:-kinetic_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: 
      - .env

  redis:
    image: redis:7-alpine
    container_name: kinetic-ledger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: 
      - .env

volumes:
  pgdata:
  redisdata:
