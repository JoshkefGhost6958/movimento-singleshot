[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-ledger"
version = "0.1.0"
description = "Trust-minimized motion commerce stack (Phase-2 demo)"
authors = [{ name = "Kinetic Ledger Team" }]
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "eth-utils>=2.3.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "google-genai>=1.50.0",  # Gemini API for analysis + embeddings + File Search
    "eth-account>=0.10.0",
    "qdrant-client>=1.7.0",
    "web3>=6.0.0",
    "boto3>=1.34.0",  # Cloudflare R2 (S3-compatible) object storage
    "google-cloud-secret-manager>=2.18.0",  # Secret Manager for API keys

]

[project.optional-dependencies]
warehouse = ["boto3>=1.34.0"]
ml = [
    "torch>=2.0.0",
    "scipy>=1.11.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "torch>=2.0.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "circle-developer-controlled-wallets>=9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kinetic_ledger*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
strict = true